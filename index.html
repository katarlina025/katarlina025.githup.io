<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>贪吃蛇</title>
<style>
*{margin:0;padding:0}
body{display:flex;justify-content:center;background:#222}
canvas{background:#000;margin-top:30px}
</style>
</head>
<body>
<canvas id="c" width="400" height="400"></canvas>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d')
let s=[{x:10,y:10}],dx=1,dy=0,fx=15,fy=15,score=0
document.onkeydown=e=>{
  if(e.key==='ArrowUp'&&dy!==1){dx=0;dy=-1}
  if(e.key==='ArrowDown'&&dy!==-1){dx=0;dy=1}
  if(e.key==='ArrowLeft'&&dx!==1){dx=-1;dy=0}
  if(e.key==='ArrowRight'&&dx!==-1){dx=1;dy=0}
}
function draw(){
  ctx.fillStyle='#000';ctx.fillRect(0,0,400,400)
  ctx.fillStyle='#0f0';s.forEach(p=>ctx.fillRect(p.x*20,p.y*20,18,18))
  ctx.fillStyle='#f00';ctx.fillRect(fx*20,fy*20,18,18)
  let nx=s[0].x+dx,ny=s[0].y+dy
  if(nx<0||nx>=20||ny<0||ny>=20||s.some(i=>i.x===nx&&i.y===ny)){alert('游戏结束！得分：'+score);location.reload()}
  s.unshift({x:nx,y:ny})
  if(nx===fx&&ny===fy){
    score++
    fx=Math.floor(Math.random()*20)
    fy=Math.floor(Math.random()*20)
  }else s.pop()
}
setInterval(draw,120)
</script>
</body>
</html>
