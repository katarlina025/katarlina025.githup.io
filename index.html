<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>我的好玩小站</title>
<style>
*{margin:0;padding:0}
body{height:100vh;overflow:hidden;background:#111;}
.star{position:absolute;color:#fff;font-size:20px;animation:fall 3s linear forwards;}
button{position:fixed;top:20px;left:20px;padding:8px 16px;border:none;border-radius:8px;background:#ff79b0;color:white;font-size:16px;cursor:pointer;}
@keyframes fall{0%{transform:translateY(-20px);opacity:1;}100%{transform:translateY(100vh);opacity:0;}}
</style>
</head>
<body>
<button onclick="changeBg()">点我换背景颜色</button>
<script>
document.onclick = function(e){
    const s = document.createElement('div');
    s.className = 'star';
    s.innerText = '✦';
    s.style.left = e.clientX+'px';
    s.style.top = e.clientY+'px';
    document.body.appendChild(s);
    setTimeout(()=>s.remove(),3000);
}
function changeBg(){
    const c = '#'+Math.floor(Math.random()*16777215).toString(16);
    document.body.style.background = c;
}
</script>
</body>
</html>
